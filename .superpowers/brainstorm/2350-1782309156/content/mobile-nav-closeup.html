<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mobile Nav Preview</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0d0d0d;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 24px;
  gap: 32px;
}

.label {
  color: rgba(255,255,255,0.35);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  text-align: center;
}

/* Phone frame */
.phone {
  width: 390px;
  background: #1A1007;
  border-radius: 44px;
  box-shadow: 0 0 0 10px #222, 0 0 0 12px #333, 0 40px 80px rgba(0,0,0,0.7);
  overflow: hidden;
}

/* NAV closed */
.nav {
  background: rgba(26,16,7,0.97);
  border-bottom: 1px solid rgba(240,232,218,0.07);
}
.nav-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  height: 56px;
}
.nav-logo { display: flex; align-items: center; gap: 10px; }
.logo-box {
  border: 1.5px solid rgba(240,232,218,0.6);
  border-radius: 3px;
  width: 40px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; letter-spacing: 0.05em; color: #F0E8DA;
  font-family: Georgia, serif;
}
.logo-txt {
  font-size: 9px; font-weight: 500;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: rgba(240,232,218,0.75); line-height: 1.4;
}

/* Hamburger → X */
.hamburger {
  display: flex; flex-direction: column; gap: 5px; padding: 4px; cursor: pointer;
}
.hamburger span {
  display: block; height: 1.5px;
  background: rgba(240,232,218,0.75);
  transition: all 0.3s ease;
  transform-origin: center;
}
.hamburger span:nth-child(1) { width: 20px; }
.hamburger span:nth-child(2) { width: 14px; }
.hamburger span:nth-child(3) { width: 20px; }

/* Open state — X */
.nav.open .hamburger span:nth-child(1) {
  transform: translateY(6.5px) rotate(45deg);
  width: 20px;
}
.nav.open .hamburger span:nth-child(2) { opacity: 0; }
.nav.open .hamburger span:nth-child(3) {
  transform: translateY(-6.5px) rotate(-45deg);
  width: 20px;
}

/* Dropdown */
.nav-dropdown {
  border-top: 1px solid rgba(240,232,218,0.07);
  display: flex; flex-direction: column;
  overflow: hidden;
  max-height: 0;
  opacity: 0;
  transition: max-height 0.35s ease, opacity 0.25s ease;
}
.nav.open .nav-dropdown {
  max-height: 400px;
  opacity: 1;
}
.nav-dropdown a {
  display: block; padding: 14px 22px;
  font-size: 13px; color: rgba(240,232,218,0.65);
  text-decoration: none;
  border-bottom: 1px solid rgba(240,232,218,0.05);
  letter-spacing: 0.02em;
}
.nav-dropdown a:hover { color: rgba(240,232,218,0.9); }
.nav-cta-wrap { padding: 14px 22px; }
.btn-cta {
  display: flex; align-items: center; justify-content: center;
  width: 100%; padding: 12px 20px;
  background: #F0E8DA; color: #1A1007;
  font-size: 12px; font-weight: 600;
  letter-spacing: 0.04em; text-decoration: none;
}

/* Page content dimmed behind */
.page-content {
  padding: 28px 22px;
  opacity: 0.18;
}
.page-content-line {
  height: 10px; border-radius: 2px;
  background: rgba(240,232,218,0.3);
  margin-bottom: 10px;
}

/* Toggle button */
.toggle-btn {
  background: rgba(240,232,218,0.08);
  border: 1px solid rgba(240,232,218,0.15);
  color: rgba(240,232,218,0.6);
  font-family: Arial, sans-serif;
  font-size: 12px; letter-spacing: 0.06em;
  padding: 10px 24px; cursor: pointer;
  border-radius: 2px;
  transition: background 0.2s;
}
.toggle-btn:hover { background: rgba(240,232,218,0.14); }
</style>
</head>
<body>

<p class="label">Mobile Nav — tap the hamburger or the button below</p>

<div class="phone">
  <nav class="nav open" id="nav">
    <div class="nav-bar">
      <div class="nav-logo">
        <div class="logo-box">TGN</div>
        <div class="logo-txt">TGN<br/>Studios</div>
      </div>
      <div class="hamburger" onclick="document.getElementById('nav').classList.toggle('open')">
        <span></span><span></span><span></span>
      </div>
    </div>
    <div class="nav-dropdown">
      <a href="#">About</a>
      <a href="#">Services</a>
      <a href="#">Packages</a>
      <a href="#">Our Studio</a>
      <a href="#">Philosophy</a>
      <div class="nav-cta-wrap">
        <a href="#" class="btn-cta">Start a Project →</a>
      </div>
    </div>
  </nav>

  <!-- Dimmed page content behind -->
  <div class="page-content">
    <div class="page-content-line" style="width:60%"></div>
    <div class="page-content-line" style="width:85%"></div>
    <div class="page-content-line" style="width:72%"></div>
    <div class="page-content-line" style="width:50%;margin-top:20px"></div>
    <div class="page-content-line" style="width:90%"></div>
  </div>
</div>

<button class="toggle-btn" onclick="document.getElementById('nav').classList.toggle('open')">
  Toggle open / closed
</button>

</body>
</html>
